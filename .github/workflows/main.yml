---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          toolchain: stable
          override: true
      - name: Install lua and neovim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit neovim
      - name: Run lua tests
        run: luajit tests/run.lua
      - name: Run neovim headless tests
        run: nvim --headless -u NONE -l tests/test_auth_persist.lua
      - name: Run tests
        run: |
          cargo test --features=lua51 --manifest-path=packages/auth/Cargo.toml
          cargo test --features=lua51 --manifest-path=packages/zfh/Cargo.toml

  build:
    needs: test
    runs-on: ubuntu-latest
    # a fork does not hold the upstream publishing key: without it the rock is
    # still packed and attached to the release, only the LuaRocks upload is skipped
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate extra.rockspec
        run: |
          perl -00ne 'print if $. == 2' ./*-scm-1.rockspec > extra.rockspec
      # without the publishing key this action still writes the rockspec and the
      # lux project, but its upload fails: keep the rest of the job running so the
      # release still gets built, and let only the last step stay red
      - uses: lumen-oss/luarocks-tag-release@v9
        continue-on-error: ${{ env.LUAROCKS_API_KEY == '' }}
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          SQLITE_LIBDIR: /usr/lib/x86_64-linux-gnu
        with:
          lux_version: latest
      - name: Pack
        env:
          SQLITE_LIBDIR: /usr/lib/x86_64-linux-gnu
        run: |
          lx --lua-version=5.1 pack
      - uses: actions/upload-artifact@v7
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          path: |
            *.rock
      - uses: softprops/action-gh-release@v3
        if: always() && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
          fail_on_unmatched_files: false
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/') && env.LUAROCKS_API_KEY != ''
        run: |
          scripts/upload.sh ./*.rock
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
